name: CI

on:
  push: {}
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '22'

jobs:
  quality:
    name: Tests, coverage, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests and enforce coverage thresholds
        run: npm run test:coverage

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: Playwright end-to-end tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - quality
      - e2e
    runs-on: ubuntu-latest

    steps:
      - name: Verify all required jobs succeeded
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "Quality job: ${QUALITY_RESULT}"
          echo "E2E job: ${E2E_RESULT}"

          if [[ "${QUALITY_RESULT}" != "success" || "${E2E_RESULT}" != "success" ]]; then
            echo "One or more required CI jobs failed or were skipped."
            exit 1
          fi
